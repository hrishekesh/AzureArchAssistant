[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-arch-assistant"
version = "0.1.0"
description = "Architecture document assembly utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.0"
]

[project.scripts]
azure-arch-assistant = "azure_arch_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
